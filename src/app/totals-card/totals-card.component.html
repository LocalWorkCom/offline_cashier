<div class="card p-4 my-3 totals-card-wrapper" [class.totals-collapsed]="!showAmounts">
  <button type="button" class="totals-toggle" (click)="toggleAmounts()" [attr.aria-expanded]="showAmounts" [attr.aria-label]="showAmounts ? 'إخفاء المبالغ' : 'إظهار المبالغ'">
    <i class="fa-solid fa-chevron-{{ showAmounts ? 'down' : 'left' }}" aria-hidden="true"></i>
  </button>
  @if (showAmounts) {
  <div class="totals">
    <div *ngFor="let pay of paymentSummary" class="payment-card ">
      <div class="payment-body">
        <div class="method">{{ pay.name }}</div>
        <div class="amount">{{ pay.value|number }} ج.م</div>
      </div>
