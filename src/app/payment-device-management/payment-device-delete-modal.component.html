<div class="modal-header border-0 position-relative justify-content-center align-items-center py-3 px-4" dir="rtl">
  <h5 class="modal-title fw-bold mb-0 text-center">تأكيد الحذف</h5>
  <button
    type="button"
    class="btn-close position-absolute top-50 start-0 translate-middle-y ms-2"
    aria-label="إغلاق"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body text-center">
  <p class="mb-0">
    هل أنت متأكد من حذف جهاز
    <strong>{{ deviceName }}</strong>
    ؟
  </p>
  <p *ngIf="deviceBalance > 0" class="text-warning mt-3 mb-0">
    هذا الجهاز عليه معاملات مدفوعة ({{ deviceBalance | number:'1.2-2':'en-US' }} ج.م)،
    سيتم تحويله إلى غير نشط بدلًا من الحذف للحفاظ على السجل.
  </p>
  <p *ngIf="errorMessage" class="text-danger mt-3 mb-0">{{ errorMessage }}</p>
</div>

<div class="modal-footer border-0">
  <button class="btn btn-light" [disabled]="isSubmitting" (click)="activeModal.dismiss()">إلغاء</button>
  <button class="btn btn-danger" [disabled]="isSubmitting" (click)="confirmDelete()">
    {{ deviceBalance > 0 ? 'تحويل إلى غير نشط' : 'حذف' }}
  </button>
</div>
