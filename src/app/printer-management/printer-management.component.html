<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="fw-bold m-0">قائمة الطابعات</h5>
  <button class="btn btn-danger rounded-3" (click)="addPrinter()">
    <i class="fas fa-plus ms-1"></i> إضافة طابعة
  </button>
</div>

<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>IP Address</th>
        <th>Port</th>
        <th>التصنيفات</th>
        <th class="text-center">الإجراءات</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let printer of printers">
        <td>{{ printer.ip }}</td>
        <td>{{ printer.port }}</td>
        <td>
          <span class="badge bg-light text-dark border me-1" *ngFor="let cat of printer.branch_menu_categories">
            {{ cat.name_ar || cat.name }}
          </span>
          <span class="text-muted small" *ngIf="!printer.branch_menu_categories?.length">لا يوجد تصنيفات</span>
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary me-2" (click)="editPrinter(printer)">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="deletePrinter(printer.id!)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="!printers.length && !isPrinterLoading">
        <td colspan="4" class="text-center p-4 text-muted">لا يوجد طابعات حالياً</td>
      </tr>
      <tr *ngIf="isPrinterLoading">
        <td colspan="4" class="text-center p-4">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Printer Modal -->
<div class="modal fade" id="printerModal" tabindex="-1" aria-labelledby="printerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="printerModalLabel">
          {{ isEditingPrinter ? 'تعديل طابعة' : 'إضافة طابعة جديدة' }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <div *ngIf="printerModalMessage" class="alert alert-danger">{{ printerModalMessage }}</div>
        
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label fw-semibold">IP Address</label>
            <input type="text" class="form-control rounded-3" placeholder="192.168.1.100" [(ngModel)]="selectedPrinter.ip">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Port</label>
            <input type="number" class="form-control rounded-3" placeholder="9100" [(ngModel)]="selectedPrinter.port">
          </div>
          
          <div class="col-12 mt-4">
            <label class="form-label fw-semibold d-block mb-3">اختر تصنيفات المنيو لهذه الطابعة:</label>
            <div class="category-selection-grid d-flex flex-wrap gap-2">
              <div *ngFor="let cat of categories" 
                   (click)="toggleCategorySelection(cat.id)"
                   [class.active]="selectedCategoryIds.includes(cat.id)"
                   class="category-pill py-2 px-3 border rounded-pill cursor-pointer transition-all">
                {{ cat.name || cat.name_en }}
                <i class="fas fa-check-circle ms-1" *ngIf="selectedCategoryIds.includes(cat.id)"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0 p-4">
        <button type="button" class="btn btn-light px-4 rounded-3" data-bs-dismiss="modal">إلغاء</button>
        <button type="button" class="btn btn-danger px-4 rounded-3" (click)="savePrinter()">
          {{ isEditingPrinter ? 'تحديث' : 'حفظ' }}
        </button>
      </div>
    </div>
  </div>
</div>
